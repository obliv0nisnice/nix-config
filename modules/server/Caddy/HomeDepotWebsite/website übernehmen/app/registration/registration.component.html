<div class="container mt-5">
  <h2 class="text-center">User Registration</h2>
  <div class="form-group">
    <label for="username">Username:</label>
    <input id="username" class="form-control" [(ngModel)]="username" />
  </div>
  <div class="form-group">
    <label for="password">Password:</label>
    <input id="password" type="password" class="form-control" [(ngModel)]="password" />
  </div>
  <div class="form-group">
    <label for="role">Role:</label>
    <select id="role" class="form-control" [(ngModel)]="role" name="role">
      <option value="admin">Admin</option>
      <option value="user">User</option>
    </select>
  </div>
  <button class="btn btn-primary mt-3" (click)="register()">Register</button>
  <div *ngIf="registrationMessage" class="registration-message">
    {{ registrationMessage }}
  </div>

  <h3 class="mt-5">Existing Users</h3>
  <table class="table">
    <thead>
    <tr>
      <th>Username</th>
      <th>Role</th>
    </tr>
    </thead>
    <tbody>

    <tr *ngFor="let user of users">
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
    </tr>
    </tbody>
  </table>
</div>
